<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PrintBros · Pedidos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#e3e6eb;--ac:#2f6fed;--acx:#fff;--ok:#1a8f4c;--wa:#c27803;--er:#d93025}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mu:#98a0ae;--bd:#2c303a;--ac:#5b8def;--acx:#0b1220;--ok:#4cc27f;--wa:#e5a53a;--er:#f26b60}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14161a;--card:#1d2026;--tx:#eceef2;--mu:#98a0ae;--bd:#2c303a;--ac:#5b8def;--acx:#0b1220;--ok:#4cc27f;--wa:#e5a53a;--er:#f26b60}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:20px 0 8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
nav{display:flex;gap:6px;margin:14px 0}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.list{display:grid;gap:8px}
.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.late{color:var(--er);font-weight:600}.soon{color:var(--wa);font-weight:600}.fine{color:var(--ok)}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.btn.d{color:var(--er)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:20}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:560px;margin:auto}
.empty{text-align:center;color:var(--mu);padding:24px}
.th{width:52px;height:52px;object-fit:cover;border-radius:8px;flex:none}
.pimg{max-width:100%;max-height:160px;border-radius:8px;margin-bottom:8px}
@media(max-width:480px){.f2{grid-template-columns:1fr}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap" id="app" style="display:none">
<header><h1>PrintBros · Pedidos</h1><span class="mu" id="hoje"></span><button class="btn" id="out">Sair</button></header>
<nav id="nav">
<button data-t="dash" class="on">Dashboard</button>
<button data-t="ped">Pedidos</button>
<button data-t="cli">Clientes</button>
<button data-t="prod">Produtos</button>
</nav>
<main id="main"></main>
<p class="mu" style="margin-top:28px">Os dados ficam salvos na nuvem e sincronizam entre seus aparelhos.</p>
<div class="bar"><button class="btn" id="exp">Exportar backup</button><button class="btn" id="imp">Importar backup</button><button class="btn" id="up">Enviar dados deste aparelho para a nuvem</button><input type="file" id="file" accept=".json" hidden></div>
</div>
<div id="login" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50"><div class="modal"><h2 style="margin-top:0">PrintBros · Entrar</h2><label>E-mail<input id="le" type="email" autocomplete="username"></label><label>Senha<input id="lp" type="password" autocomplete="current-password"></label><div class="bar"><button class="btn p" id="lb">Entrar</button></div><div class="late" id="lm"></div></div></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
const ST=["Orçamento","Aprovado","Em produção","Pronto","Entregue","Cancelado"];
const KEY="printbros.v1";
let db={orders:[],products:[]},tab="dash",flt="abertos",mem=null,cq="";
function load(){try{const r=localStorage.getItem(KEY);if(r)db=JSON.parse(r)}catch(e){if(mem)db=mem}}
function save(){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const days=s=>s?Math.round((new Date(s+"T00:00:00")-today())/864e5):null;
const fd=s=>s?new Date(s+"T00:00:00").toLocaleDateString("pt-BR"):"sem data";
const open=o=>!["Entregue","Cancelado","Orçamento"].includes(o.status);
function prazo(o){const d=days(o.date);if(d===null)return'<span class="mu">sem data</span>';
 if(!open(o))return'<span class="mu">'+fd(o.date)+'</span>';
 if(d<0)return'<span class="late">Atrasado '+(-d)+'d · '+fd(o.date)+'</span>';
 if(d===0)return'<span class="soon">Hoje</span>';
 if(d<=3)return'<span class="soon">Em '+d+'d · '+fd(o.date)+'</span>';
 return'<span class="fine">Em '+d+'d · '+fd(o.date)+'</span>'}
function pay(o){const t=(+o.value||0)*(+o.qty||1),f=Math.max(0,t-(+o.paid||0));return'<div>'+brl(t)+'</div><div class="mu">Sinal: '+brl(o.paid)+'</div>'+(o.status==="Cancelado"?'':f>0?'<div class="soon">Falta: '+brl(f)+'</div>':'<div class="fine">Pago</div>')}
function orderCard(o){const p=db.products.find(x=>x.id===o.pid);return'<div class="card row" data-o="'+o.id+'">'+(p&&p.img?'<img class="th" src="'+p.img+'" alt="">':'')+'<div style="flex:1;min-width:0"><b>'+esc(o.client)+'</b>'+(o.city?' <span class="mu">· '+esc(o.city)+'</span>':'')+'<div>'+esc(o.qty||1)+'× '+esc(o.item)+'</div><div class="mu">'+esc(o.specs).slice(0,90)+'</div></div><div style="text-align:right;flex:none">'+pay(o)+'<div>'+prazo(o)+'</div><span class="tag">'+o.status+'</span></div></div>'}

function render(){
 $("#hoje").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
 const m=$("#main");
 if(tab==="cli"){
  const L=clients().filter(c=>c.name.toLowerCase().includes(cq.toLowerCase()));
  m.innerHTML='<div class="bar"><input id="cs" placeholder="Buscar cliente" value="'+esc(cq)+'"></div><div class="list">'+(L.length?L.map(c=>{const ab=c.orders.filter(open).length;return'<div class="card row" data-c="'+esc(c.name)+'"><div><b>'+esc(c.name)+'</b><div class="mu">'+esc((c.city?c.city+" · ":"")+(c.phone||"sem contato"))+'</div><div class="mu">'+c.orders.length+' registro(s)'+(ab?' · '+ab+' em andamento':'')+'</div></div><div style="text-align:right"><div>'+brl(spent(c))+'</div><span class="mu">total comprado</span></div></div>'}).join(""):'<div class="card empty">Os clientes aparecem aqui conforme você cadastra pedidos.</div>')+'</div>';
  const s=$("#cs");s.oninput=e=>{cq=e.target.value;render();const n=$("#cs");n.focus();n.setSelectionRange(n.value.length,n.value.length)};
 }else if(tab==="dash"){
  const ab=db.orders.filter(open);
  const next=ab.slice().sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
  const rec=ab.reduce((s,o)=>s+Math.max(0,(+o.value||0)*(+o.qty||1)-(+o.paid||0)),0);
  const atr=ab.filter(o=>days(o.date)<0&&o.date).length;
  const orc=db.orders.filter(o=>o.status==="Orçamento").length;
  m.innerHTML='<div class="grid"><div class="card stat"><b>'+ab.length+'</b><span>Pedidos em andamento</span></div><div class="card stat"><b class="'+(atr?"late":"")+'">'+atr+'</b><span>Atrasados</span></div><div class="card stat"><b>'+orc+'</b><span>Orçamentos abertos</span></div><div class="card stat"><b>'+brl(rec)+'</b><span>A receber</span></div></div><h2>Próximas entregas</h2><div class="list">'+(next.length?next.slice(0,8).map(orderCard).join(""):'<div class="card empty">Nenhuma entrega pendente. Cadastre um pedido na aba Pedidos.</div>')+'</div>';
 }else if(tab==="ped"){
  let l=db.orders.slice();
  if(flt==="abertos")l=l.filter(o=>!["Entregue","Cancelado"].includes(o.status));
  else if(flt!=="todos")l=l.filter(o=>o.status===flt);
  l.sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));
  m.innerHTML='<div class="bar"><button class="btn p" id="novo">+ Novo pedido</button><select id="flt" style="width:auto"><option value="abertos">Em aberto</option><option value="todos">Todos</option>'+ST.map(s=>'<option>'+s+'</option>').join("")+'</select></div><div class="list">'+(l.length?l.map(orderCard).join(""):'<div class="card empty">Nada por aqui.</div>')+'</div>';
  $("#flt").value=flt;$("#flt").onchange=e=>{flt=e.target.value;render()};$("#novo").onclick=()=>orderForm();
 }else{
  m.innerHTML='<div class="bar"><button class="btn p" id="novo">+ Novo produto</button></div><div class="list">'+(db.products.length?db.products.map(p=>'<div class="card row" data-p="'+p.id+'">'+(p.img?'<img class="th" src="'+p.img+'" alt="">':'')+'<div style="flex:1"><b>'+esc(p.name)+'</b><div class="mu">'+esc(p.material)+(p.time?' · '+esc(p.time):'')+'</div><div class="mu">'+esc(p.desc).slice(0,100)+'</div></div><div>'+brl(p.price)+'</div></div>').join(""):'<div class="card empty">Cadastre seus produtos para preencher pedidos mais rápido.</div>')+'</div>';
  $("#novo").onclick=()=>prodForm();
 }
 m.querySelectorAll("[data-o]").forEach(e=>e.onclick=()=>orderForm(e.dataset.o));
 m.querySelectorAll("[data-p]").forEach(e=>e.onclick=()=>prodForm(e.dataset.p));
 m.querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>clientView(e.dataset.c));
}
function show(h){$("#modal").innerHTML=h;$("#ov").classList.add("on")}
function hide(){$("#ov").classList.remove("on")}
$("#ov").onclick=e=>{if(e.target.id==="ov")hide()};
const val=id=>$("#"+id).value;

function clients(){const mp={};db.orders.forEach(o=>{const k=o.client.trim().toLowerCase();const c=mp[k]||(mp[k]={name:o.client.trim(),phone:"",city:"",orders:[]});if(o.phone)c.phone=o.phone;if(o.city)c.city=o.city;c.orders.push(o)});return Object.values(mp).sort((a,b)=>a.name.localeCompare(b.name))}
const spent=c=>c.orders.filter(o=>!["Orçamento","Cancelado"].includes(o.status)).reduce((s,o)=>s+(+o.value||0)*(+o.qty||1),0);
function clientView(name){
 const c=clients().find(x=>x.name.toLowerCase()===name.toLowerCase());if(!c)return;
 let num=c.phone.replace(/\D/g,"");if(num.length>=10&&num.length<=11)num="55"+num;
 const l=c.orders.slice().sort((a,b)=>(b.created||"").localeCompare(a.created||""));
 const fin=c.orders.filter(o=>o.status==="Entregue").length;
 show('<h2 style="margin-top:0">'+esc(c.name)+'</h2><div class="mu">'+esc((c.city?c.city+" · ":"")+(c.phone||"sem contato"))+'</div><div class="grid" style="margin:12px 0"><div class="card stat"><b>'+brl(spent(c))+'</b><span>Total comprado</span></div><div class="card stat"><b>'+fin+'</b><span>Pedidos entregues</span></div></div><div class="bar"><button class="btn p" id="cn">+ Novo pedido</button>'+(num?'<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+num+'" style="text-decoration:none">WhatsApp</a>':'')+'<button class="btn" id="cx">Fechar</button></div><h2>Histórico</h2><div class="list">'+l.map(orderCard).join("")+'</div>');
 $("#cx").onclick=hide;
 $("#cn").onclick=()=>orderForm(null,{client:c.name,phone:c.phone,city:c.city});
 document.querySelectorAll("#modal [data-o]").forEach(e=>e.onclick=()=>orderForm(e.dataset.o));
}
function msgText(o){
 const t=(+o.value||0)*(+o.qty||1),f=Math.max(0,t-(+o.paid||0)),orc=o.status==="Orçamento";
 let s="Olá, "+o.client+"! Tudo bem?\n\nSegue "+(orc?"o orçamento solicitado":"a confirmação do seu pedido")+":\n\n";
 s+="Peça: "+o.item+"\n"+(o.specs?"Especificações: "+o.specs+"\n":"")+"Quantidade: "+(o.qty||1)+"\nValor unitário: "+brl(o.value)+"\nValor total: "+brl(t)+"\n";
 if(+o.paid>0)s+="Sinal recebido: "+brl(o.paid)+"\nSaldo a pagar: "+brl(f)+"\n";
 if(o.date)s+="Previsão de entrega: "+fd(o.date)+"\n";
 s+="\n"+(orc?"Fico no aguardo da sua confirmação para iniciarmos a produção.":"Qualquer dúvida, estou à disposição.")+"\n\nAtenciosamente,\n"+(db.biz||"");
 return s}
function msgForm(id){
 const o=db.orders.find(x=>x.id===id);if(!o)return;
 show('<h2 style="margin-top:0">Mensagem para '+esc(o.client)+'</h2><label>Nome da sua empresa (assinatura)<input id="bz" value="'+esc(db.biz)+'"></label><label>Mensagem (você pode editar antes de enviar)<textarea id="mt" style="min-height:260px"></textarea></label><div class="bar"><button class="btn p" id="cp">Copiar mensagem</button><button class="btn" id="wa">Abrir no WhatsApp</button><button class="btn" id="cx">Voltar</button></div><div class="mu" id="mm"></div>');
 $("#mt").value=msgText(o);
 $("#bz").oninput=e=>{db.biz=e.target.value;cloudBiz();$("#mt").value=msgText(o)};
 $("#cp").onclick=()=>{const t=$("#mt"),ok=()=>$("#mm").textContent="Mensagem copiada!";(navigator.clipboard?navigator.clipboard.writeText(t.value).then(ok):Promise.reject()).catch(()=>{t.select();document.execCommand("copy");ok()})};
 $("#wa").onclick=()=>{let num=(o.phone||"").replace(/\D/g,"");if(num.length>=10&&num.length<=11)num="55"+num;window.open("https://wa.me/"+num+"?text="+encodeURIComponent($("#mt").value),"_blank")};
 $("#cx").onclick=()=>orderForm(id);
}
function orderForm(id,pre){
 const o=db.orders.find(x=>x.id===id)||{...pre,status:"Orçamento",qty:1,created:new Date().toISOString().slice(0,10)};
 const clients=[...new Set(db.orders.map(x=>x.client))];
 show('<h2 style="margin-top:0">'+(id?"Editar pedido":"Novo pedido")+'</h2>'+
 '<div class="f2"><label>Cliente<input id="c" list="cl" value="'+esc(o.client)+'"><datalist id="cl">'+clients.map(c=>'<option value="'+esc(c)+'">').join("")+'</datalist></label>'+
 '<label>Contato (WhatsApp)<input id="t" value="'+esc(o.phone)+'"></label></div>'+'<label>Cidade<input id="ci" value="'+esc(o.city)+'"></label>'+
 '<label>Produto do catálogo<select id="pp"><option value="">— escolher ou digitar abaixo —</option>'+db.products.map(p=>'<option value="'+p.id+'"'+(p.id===o.pid?" selected":"")+'>'+esc(p.name)+'</option>').join("")+'</select></label>'+
 '<label>Peça<input id="i" value="'+esc(o.item)+'"></label>'+
 '<label>Especificações (material, cor, medidas, acabamento)<textarea id="s">'+esc(o.specs)+'</textarea></label>'+
 '<div class="f2"><label>Quantidade<input id="q" type="number" min="1" value="'+(o.qty||1)+'"></label><label>Valor unitário (R$)<input id="v" type="number" step="0.01" value="'+(o.value??"")+'"></label>'+
 '<label>Sinal já pago (R$)<input id="pg" type="number" step="0.01" value="'+(o.paid??"")+'"></label><label>Entrega prevista<input id="d" type="date" value="'+esc(o.date)+'"></label></div>'+
 '<label>Status<select id="st">'+ST.map(s=>'<option'+(s===o.status?" selected":"")+'>'+s+'</option>').join("")+'</select></label>'+
 '<label>Observações<textarea id="n">'+esc(o.notes)+'</textarea></label>'+
 '<div class="mu" id="tot"></div><div class="bar" style="margin-top:12px"><button class="btn p" id="ok">Salvar</button><button class="btn" id="cx">Cancelar</button>'+(id?'<button class="btn" id="msg">Mensagem p/ cliente</button>':'')+(id?'<button class="btn d" id="del">Excluir</button>':'')+'</div>');
 const tot=()=>$("#tot").textContent="Total: "+brl(val("v")*val("q"))+" · Falta receber: "+brl(Math.max(0,val("v")*val("q")-val("pg")));
 ["v","q","pg"].forEach(k=>$("#"+k).oninput=tot);tot();
 $("#pp").onchange=e=>{const p=db.products.find(x=>x.id===e.target.value);if(p){$("#i").value=p.name;$("#v").value=p.price;if(!val("s"))$("#s").value=[p.material,p.desc].filter(Boolean).join(" · ");tot()}};
 $("#cx").onclick=hide;
 if(id)$("#msg").onclick=()=>msgForm(id);
 if(id)$("#del").onclick=()=>{if(confirm("Excluir este pedido?")){db.orders=db.orders.filter(x=>x.id!==id);cloudDel("orders",id);save();hide();render()}};
 $("#ok").onclick=()=>{
  if(!val("c").trim()||!val("i").trim()){alert("Informe o cliente e a peça.");return}
  const n={id:id||uid(),client:val("c").trim(),phone:val("t"),city:val("ci").trim(),pid:val("pp"),item:val("i").trim(),specs:val("s"),qty:+val("q")||1,value:+val("v")||0,paid:+val("pg")||0,date:val("d"),status:val("st"),notes:val("n"),created:o.created};
  if(id)db.orders=db.orders.map(x=>x.id===id?n:x);else db.orders.push(n);cloudSet("orders",n);
  save();hide();render()};
}
function prodForm(id){
 const p=db.products.find(x=>x.id===id)||{};
 show('<h2 style="margin-top:0">'+(id?"Editar produto":"Novo produto")+'</h2>'+
 '<div id="pv">'+(p.img?'<img class="pimg" src="'+p.img+'" alt=""><br><button class="btn" id="rm" type="button">Remover foto</button>':'')+'</div><label>Foto do produto<input id="pf" type="file" accept="image/*"></label>'+'<label>Nome<input id="pn" value="'+esc(p.name)+'"></label>'+
 '<div class="f2"><label>Material<input id="pm" value="'+esc(p.material)+'"></label><label>Preço (R$)<input id="pr" type="number" step="0.01" value="'+(p.price??"")+'"></label></div>'+
 '<label>Tempo de produção (ex: 2 dias)<input id="pt" value="'+esc(p.time)+'"></label>'+
 '<label>Descrição / medidas<textarea id="pd">'+esc(p.desc)+'</textarea></label>'+
 '<div class="bar"><button class="btn p" id="ok">Salvar</button><button class="btn" id="cx">Cancelar</button>'+(id?'<button class="btn d" id="del">Excluir</button>':'')+'</div>');
 $("#cx").onclick=hide;
 let img=p.img||"";
 $("#pv").onclick=e=>{if(e.target.id==="rm"){img="";$("#pv").innerHTML=""}};
 $("#pf").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);img=cv.toDataURL("image/jpeg",.75);$("#pv").innerHTML='<img class="pimg" src="'+img+'" alt=""><br><button class="btn" id="rm" type="button">Remover foto</button>'};im.src=r.result};r.readAsDataURL(f)};
 if(id)$("#del").onclick=()=>{if(confirm("Excluir este produto?")){db.products=db.products.filter(x=>x.id!==id);cloudDel("products",id);save();hide();render()}};
 $("#ok").onclick=()=>{
  if(!val("pn").trim()){alert("Informe o nome.");return}
  const n={id:id||uid(),name:val("pn").trim(),material:val("pm"),price:+val("pr")||0,time:val("pt"),desc:val("pd"),img};
  if(id)db.products=db.products.map(x=>x.id===id?n:x);else db.products.push(n);cloudSet("products",n);
  save();hide();render()};
}
$("#nav").onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}};
$("#exp").onclick=()=>{const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(db,null,1));a.download="printbros-backup.json";a.click()};
$("#imp").onclick=()=>$("#file").click();
$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.orders&&j.products){uploadAll(j).catch(e=>alert("Erro: "+e.message))}else alert("Arquivo inválido.")}catch(x){alert("Arquivo inválido.")}};r.readAsText(f)};

firebase.initializeApp({apiKey:"AIzaSyAmfM2X6LIQBzSfnWSr_mdnNPISSE1dbeI",authDomain:"printbros3d-b4f90.firebaseapp.com",projectId:"printbros3d-b4f90",storageBucket:"printbros3d-b4f90.firebasestorage.app",messagingSenderId:"686242643911",appId:"1:686242643911:web:b98445a843418d30fb63e2"});
const auth=firebase.auth(),fs=firebase.firestore();
fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
let me=null,unsubs=[];
const base=()=>fs.collection("users").doc(me);
const clean=o=>JSON.parse(JSON.stringify(o));
function cloudSet(c,o){if(me)base().collection(c).doc(o.id).set(clean(o)).catch(e=>alert("Não foi possível salvar na nuvem: "+e.message))}
function cloudDel(c,id){if(me)base().collection(c).doc(id).delete().catch(e=>alert("Não foi possível excluir: "+e.message))}
function cloudBiz(){if(me)base().collection("meta").doc("settings").set({biz:db.biz||""}).catch(()=>{})}
async function uploadAll(j){
 const it=[...(j.orders||[]).map(o=>["orders",o]),...(j.products||[]).map(p=>["products",p])].filter(x=>x[1]&&x[1].id);
 for(let i=0;i<it.length;i+=25){const b=fs.batch();it.slice(i,i+25).forEach(([c,o])=>b.set(base().collection(c).doc(o.id),clean(o)));await b.commit()}
 if(j.biz){db.biz=j.biz;cloudBiz()}
 alert("Pronto! "+it.length+" registro(s) enviados para a nuvem.")}
auth.onAuthStateChanged(u=>{
 unsubs.forEach(f=>f());unsubs=[];
 if(!u){me=null;db={orders:[],products:[],biz:""};$("#login").style.display="flex";$("#app").style.display="none";return}
 me=u.uid;$("#login").style.display="none";$("#app").style.display="";
 const er=e=>alert("Erro ao carregar da nuvem: "+e.message);
 unsubs.push(base().collection("orders").onSnapshot(s=>{db.orders=s.docs.map(d=>d.data());render()},er));
 unsubs.push(base().collection("products").onSnapshot(s=>{db.products=s.docs.map(d=>d.data());render()},er));
 unsubs.push(base().collection("meta").doc("settings").onSnapshot(s=>{db.biz=(s.data()||{}).biz||""},er));
});
$("#lb").onclick=()=>{$("#lm").textContent="";auth.signInWithEmailAndPassword($("#le").value.trim(),$("#lp").value).catch(e=>{$("#lm").textContent=e.code==="auth/network-request-failed"?"Sem conexão com a internet.":"E-mail ou senha incorretos."})};
$("#lp").onkeydown=e=>{if(e.key==="Enter")$("#lb").click()};
$("#out").onclick=()=>auth.signOut();
$("#up").onclick=()=>{let j=null;try{j=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 const n=j?(j.orders||[]).length:0,m=j?(j.products||[]).length:0;
 if(!n&&!m){alert("Não há dados salvos neste aparelho/navegador.");return}
 if(confirm("Enviar "+n+" pedido(s) e "+m+" produto(s) deste aparelho para a nuvem?"))uploadAll(j).catch(e=>alert("Erro: "+e.message))};
render();
</script>
</body>
</html>
